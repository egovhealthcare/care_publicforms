{% extends "patient_feedback/base.html" %}
{% load patient_feedback_tags %}

{% block screen %}
<form id="{{ form_id }}" class="screen screen--guest" method="post">
  {% csrf_token %}
  <div class="area-head stack stack--8">
    <h2 class="h2">{% t "guest_heading" %}</h2>
    <p class="lead-sm">{% t "guest_lead" %}</p>
  </div>

  <div class="area-body stack stack--24">
    {% for group in groups %}
    <fieldset class="group stack stack--10">
      <legend class="kicker">{% t group.title %}</legend>
      <div class="chips{% if group.kind %} {{ group.kind }}{% endif %}">
        {% for code, labels in group.options %}
        <label class="chip">
          <input type="radio" name="{{ group.name }}" value="{{ code }}"{% if code == group.selected %} checked{% endif %}>
          <span class="chip-face">{% tr labels %}</span>
        </label>
        {% endfor %}
      </div>
    </fieldset>
    {% endfor %}
  </div>

  <div class="area-nav stack stack--10">
    <button type="submit" name="action" value="start" class="btn btn--primary btn--lg btn-cta">{% t "guest_start" %}</button>
    <button type="submit" name="action" value="back" class="btn btn--ghost btn--md btn-quiet">{% t "back" %}</button>
  </div>
</form>
{% endblock %}
