{% extends "patient_feedback/base.html" %}
{% load patient_feedback_tags %}

{% block screen %}
<section class="screen screen--review">
  <div class="area-head stack stack--8">
    <h2 class="h2">{% t "review_heading" %}</h2>
    <p class="lead-sm">{% t "review_lead" %}</p>
  </div>

  <div class="area-body rows">
    {% for row in rows %}
    <a class="row" href="{{ row.url }}">
      <span class="row-label">{{ row.label }}</span>
      <span class="row-value{% if row.empty %} is-empty{% endif %}">{{ row.value }}</span>
    </a>
    {% endfor %}
  </div>

  <div class="area-note callout callout--small">{% t "review_note" %}</div>

  <form class="area-nav navrow" method="post">
    {% csrf_token %}
    <a class="btn btn--ghost btn--md btn-back" href="{{ urls.comments }}">{% t "back" %}</a>
    <button type="submit" class="btn btn--primary btn--lg btn-cta btn-cta--grow">{% t "submit" %}</button>
  </form>
</section>
{% endblock %}
