{% load public_feedback_tags %}
<section class="step screen screen--review{% if current_step == "review" %} is-active{% endif %}" data-step="review">
  <div class="area-head stack stack--8">
    <h2 class="h2">{% t "review_heading" %}</h2>
    <p class="lead-sm">{% t "review_lead" %}</p>
  </div>

  {# Rendered from the posted answers; kiosk.js rebuilds it from the page as answers change. #}
  <div class="area-body rows" id="reviewRows">
    {% for row in review_rows %}
    <button type="submit" name="nav" value="edit:{{ row.key }}" class="row">
      <span class="row-label">{% tr row.label %}</span>
      <span class="row-value{% if row.value is None %} is-empty{% endif %}">{% if row.value is None %}{% t "not_answered" %}{% else %}{% tr row.value %}{% endif %}{% if row.note %}<span class="row-note">{{ row.note }}</span>{% endif %}</span>
    </button>
    {% endfor %}
  </div>
  <span id="notAnsweredText" hidden>{% t "not_answered" %}</span>

  <div class="area-note callout callout--small">{% t "review_note" %}</div>

  <div class="area-nav navrow">
    <button type="submit" name="nav" value="back" class="btn btn--ghost btn--md btn-back" data-action="review-back">{% t "back" %}</button>
    <button type="submit" name="nav" value="submit" class="btn btn--primary btn--lg btn-cta btn-cta--grow">{% t "submit" %}</button>
  </div>
</section>
