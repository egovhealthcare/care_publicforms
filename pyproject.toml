[project]
name = "care_publicforms"
version = "0.1.0"
description = "Public feedback: a Care plugin that serves server-rendered patient satisfaction surveys (OPD and inpatient) on touch-screen TV kiosks"
readme = "README.md"
authors = [{ name = "Open Healthcare Network", email = "support@ohc.network" }]
maintainers = [
    { name = "Open Healthcare Network", email = "support@ohc.network" },
]
license = { text = "MIT" }
dependencies = ["django", "djangorestframework"]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "ruff", # linting
]

[project.urls]
homepage = "https://github.com/egovhealthcare/care_publicforms"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
public_feedback = ["templates/**/*", "static/**/*", "locale/*.json"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/public_feedback/migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["public_feedback"]
known-third-party = ["care"]

[tool.uv]
package = true
